# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy ASP.Net Core app to Azure Web App - Ecommerce47

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: './MisterRobotoArigato'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core SDK 2.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '2.1.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore
        working-directory: ${{ env.PROJECT_PATH }}

      - name: dotnet publish (Self-Contained Linux Bundle)
        run: dotnet publish -c Release -r linux-x64 --self-contained true -o ${{env.DOTNET_ROOT}}/myapp
        working-directory: ${{ env.PROJECT_PATH }}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6683A5D8F920405594C54B53F2F6C3A9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B445F53A8DAB4595B0AC1D61B409EF86 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD674F26F54B4C79949E50594709BB2E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Ecommerce47'
          slot-name: 'Production'
          package: .
